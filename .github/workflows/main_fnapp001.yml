name: Deploy to Azure Function App - func-apicatalog-lab-001

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC login to Azure
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies into the package
        run: pip install -r requirements.txt --target=".python_packages/lib/site-packages"


      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_22B179B940EE4544BE9E487098B06FF4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4AC1F21BC45F4F56BA301CC0CC05DC81 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_97A9BBF4B96E4E0FA9D0513A124BBF57 }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'fnapp001'
          package: '.'