<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>API catalog assistant</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:16px;color:#222}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding-bottom:8px}
#log{min-height:300px;padding:12px 0}
.q{background:#e8f0fe;padding:8px 12px;border-radius:10px;margin:10px 0 10px auto;max-width:75%;width:fit-content}
.a{background:#f4f4f4;padding:10px 12px;border-radius:10px;margin:10px 0;white-space:pre-wrap}
.src{font-size:12px;color:#555;margin-top:6px;white-space:pre-wrap}
form{display:flex;gap:8px}
input[type=text]{flex:1;padding:8px}
button{padding:8px 12px;cursor:pointer}
</style></head>
<body>
<header><b>API catalog assistant</b><span id="who"></span></header>
<div id="log"></div>
<form id="f">
<input id="api" type="text" placeholder="API filter (optional)" style="max-width:180px">
<input id="q" type="text" placeholder="Ask about an API" required>
<button>Ask</button>
</form>
<script>
const log = document.getElementById('log');

async function init() {
  const r = await fetch('/.auth/me');
  const d = r.ok ? await r.json() : [];
  const p = d.length ? d[0] : null;
  if (!p) {
    location.href = '/.auth/login/aad?post_login_redirect_uri=' + encodeURIComponent('/api/chat');
    return;
  }
  document.getElementById('who').textContent = p.user_id || '';
}

function add(cls, text) {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = text;
  log.appendChild(d);
  return d;
}

function post(url, body) {
  return fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  const api = document.getElementById('api').value.trim();
  if (!q) return;
  add('q', q);
  document.getElementById('q').value = '';
  const box = add('a', 'Thinking…');
  try {
    const r = await post('/api/ask', {question: q, apiname: api || null});
    if (r.status === 401) { location.reload(); return; }
    const d = await r.json();
    if (!r.ok) { box.textContent = d.error || 'Something went wrong. Try again.'; return; }
    box.textContent = d.answer;
    const s = document.createElement('div');
    s.className = 'src';
    s.textContent = d.sources.map(x => '[' + x.n + '] ' + x.apiname + ' ' + x.version + ' · ' + x.fileName + ' · ' + x.title).join('\n');
    box.appendChild(s);
    const fb = document.createElement('div');
    fb.className = 'src';
    fb.textContent = 'Was this helpful? ';
    [['Yes', true], ['No', false]].forEach(([label, v]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.onclick = async () => {
        await post('/api/feedback', {helpful: v});
        fb.textContent = 'Thanks for the feedback.';
      };
      fb.appendChild(b);
    });
    box.appendChild(fb);
  } catch (err) {
    box.textContent = 'Something went wrong. Try again.';
  }
});

init();
</script>
</body></html>
